<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1d15" />
      <stop offset="60%" stop-color="#123829" />
      <stop offset="100%" stop-color="#194c38" />
    </linearGradient>

    <!-- Emerald Flow Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Warm Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#e5c179" />
      <stop offset="100%" stop-color="#b4833e" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="#e5c179" stroke-width="4" stroke-opacity="0.3" />

  <!-- Subtle Inner Ring -->
  <rect x="28" y="28" width="456" height="456" rx="100" fill="none" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.2" />

  <!-- Central "Q" Queue Flow Emblem -->
  <g transform="translate(256, 240)">
    <!-- Outer Flow Arc (Queue Ribbon) -->
    <path d="M 0 -130 A 130 130 0 1 1 -130 0 A 130 130 0 0 1 -45 -122" 
          fill="none" 
          stroke="url(#emeraldGrad)" 
          stroke-width="36" 
          stroke-linecap="round" 
          filter="url(#subtleGlow)" />

    <!-- Inner Fast-Track Flow (Concentric Harmony) -->
    <path d="M 0 -80 A 80 80 0 1 1 -80 0 A 80 80 0 0 1 -30 -74" 
          fill="none" 
          stroke="url(#emeraldGrad)" 
          stroke-width="18" 
          stroke-linecap="round" 
          opacity="0.85" />

    <!-- Core Dot / Target Counter Center -->
    <circle cx="0" cy="0" r="26" fill="url(#goldGrad)" />
    <circle cx="0" cy="0" r="14" fill="#0f2b20" />

    <!-- The "Q" Dynamic Progress Arrow / Ticket Tail -->
    <path d="M 52 52 L 128 128 M 128 128 L 76 128 M 128 128 L 128 76" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="34" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          filter="url(#subtleGlow)" />

    <!-- Small Accent Queue Ticket Notches -->
    <circle cx="-100" cy="0" r="6" fill="#fef08a" opacity="0.75" />
    <circle cx="0" cy="100" r="6" fill="#fef08a" opacity="0.75" />
  </g>
</svg>
